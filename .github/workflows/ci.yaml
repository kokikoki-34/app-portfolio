name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Build Images (Check)
        run: task build

      - name: Run Tests
        run: task -t ./infra/ci/taskfile.yaml ci-test

      - name: Tear Down
        run: task clean
