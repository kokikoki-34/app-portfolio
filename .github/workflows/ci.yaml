name: CI Pipeline (Task Based)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Test via Task
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Build Images
        run: task build

      - name: Run Tests
        run: task -t ./infra/ci/taskfile.yaml ci-test

      - name: Tear Down
        run: task clean

  deploy:
    name: Deploy to Cloud Run
    # Only deploy on push events, not on pull requests
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: "app-portfolio-488310"
      REGION: "asia-northeast1"
      GAR_LOCATION: "asia-northeast1"
      REPOSITORY: "app-repo"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Determine environment variables based on the branch name
      - name: Set environment specific variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV_NAME=main" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=" >> $GITHUB_ENV # Production uses no suffix
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=-dev" >> $GITHUB_ENV # Development uses -dev suffix
          fi

      # Authenticate to Google Cloud via Workload Identity Federation
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/442469161656/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-deployer@app-portfolio-488310.iam.gserviceaccount.com"

      # Configure Docker to use gcloud as a credential helper for Artifact Registry
      - name: Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Build and Push Backend Image with environment-specific tags
      - name: Build and Push Backend
        run: |
          TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend-${{ env.ENV_NAME }}:${{ github.sha }}"
          docker build -t $TAG ./src/backend
          docker push $TAG
          echo "BACKEND_IMAGE=$TAG" >> $GITHUB_ENV

      # Build and Push Frontend Image with environment-specific tags
      - name: Build and Push Frontend
        run: |
          TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend-${{ env.ENV_NAME }}:${{ github.sha }}"
          docker build -t $TAG ./src/frontend
          docker push $TAG
          echo "FRONTEND_IMAGE=$TAG" >> $GITHUB_ENV

      # 1. Deploy Backend Service
      - name: Deploy Backend
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: "app-portfolio-backend${{ env.SERVICE_SUFFIX }}"
          image: ${{ env.BACKEND_IMAGE }}
          region: ${{ env.REGION }}
          flags: --no-allow-unauthenticated

      # 2. Deploy Frontend Service
      - name: Deploy Frontend
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: "app-portfolio-frontend${{ env.SERVICE_SUFFIX }}"
          image: ${{ env.FRONTEND_IMAGE }}
          region: ${{ env.REGION }}
          flags: --no-allow-unauthenticated
