name: test

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x
      - name: Build Images (Check)
        run: task build
      - name: Run Tests
        run: task -t ./infra/ci/taskfile.yaml ci-test
      - name: Tear Down
        run: task clean
