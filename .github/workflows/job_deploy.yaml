on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  GAR_LOCATION: asia-northeast1
  ENV_SUFFIX: ${{ github.ref_name == 'main' && '' || '-dev' }}
  REPOSITORY: app-portfolio-repo${{ github.ref_name == 'main' && '' || '-dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        service: [proxy, backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |-
          IMAGE_NAME="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}${{ env.ENV_SUFFIX}}:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" ./src/${{ matrix.service }}
          docker push "$IMAGE_NAME"
          echo "IMAGE_URL=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Fetch Service URLs for Proxy
        if: matrix.service == 'proxy'
        id: fetch-urls
        run: |
          B_URL=$(gcloud run services describe app-portfolio-backend${{ env.ENV_SUFFIX }} --region ${{ env.REGION }} --format 'value(status.url)')
          F_URL=$(gcloud run services describe app-portfolio-frontend${{ env.ENV_SUFFIX }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "backend_url=$B_URL" >> $GITHUB_OUTPUT
          echo "frontend_url=$F_URL" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: app-portfolio-${{ matrix.service }}${{ env.ENV_SUFFIX }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URL }}
          env_vars: |-
            ${{ matrix.service == 'proxy' && format('URL_BACKEND={0},URL_FRONTEND={1}', steps.fetch-urls.outputs.backend_url, steps.fetch-urls.outputs.frontend_url) || '' }}
