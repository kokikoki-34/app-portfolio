openapi: 3.0.3
info:
  title: Health API
  description: Portfolio backend with health monitoring.
  version: 1.0.0

paths:
  /api/health:
    get:
      summary: Check health of the service.
      operationId: getHealth
      responses:
        "200":
          description: Healthy service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, currentTime]
      properties:
        status:
          type: string
          example: "healthy"
        currentTime:
          type: string
          format: date-time
          example: "2026-03-12T19:34:24Z"
