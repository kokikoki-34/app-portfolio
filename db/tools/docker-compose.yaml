name: app-portfolio

services:
  # ---------------------------------------------------------
  # Shadow Database for Atlas Diff (Profile: tools)
  # ---------------------------------------------------------
  shadow-db:
    image: postgres:latest
    container_name: shadow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres", "-p", "5432"]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------
  # Atlas Migrate: Generate diff (Profile: tools)
  # ---------------------------------------------------------
  atlas-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-migrate
    volumes:
      - ../migration:/migration:rw
      - ../schema:/schema:ro
    environment:
      - MIGRATION_NAME=${MIGRATION_NAME:-""}
    depends_on:
      shadow-db:
        condition: service_healthy
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        # concatenate all sql files in the schema directories into a single file
        find /schema -name "*.sql" | sort | xargs cat > /tmp/all_schema.sql && \

        # run atlas migrate
        atlas migrate diff "${MIGRATION_NAME}" \
          --dir "file:///migration" \
          --to "file:///tmp/all_schema.sql" \
          --dev-url "postgres://postgres:postgres@shadow-db:5432/postgres?sslmode=disable"
