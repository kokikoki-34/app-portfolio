# docker-compose.yml
name: app-portfolio

services:
  # ---------------------------------------------------------
  # Go Backend API
  # ---------------------------------------------------------
  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - ${PORT_BACKEND:-8000}:8080
    environment:
      - PORT_FRONTEND=${PORT_FRONTEND:-5173}
      - HOST_BACKEND=${HOST_BACKEND:-localhost}
      - HOST_FRONTEND=${HOST_FRONTEND:-localhost}
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------
  # React/Vite Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - ${PORT_FRONTEND:-3000}:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
