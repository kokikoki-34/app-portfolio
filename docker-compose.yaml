# docker-compose.yml
name: app-portfolio

services:
  # ---------------------------------------------------------
  # Go Backend API
  # ---------------------------------------------------------
  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - ${PORT_BACKEND:-8000}:8080
    environment:
      - PORT_FRONTEND=${PORT_FRONTEND:-3000}
      - URL_BACKEND=${URL_BACKEND:-http://localhost}
      - URL_FRONTEND=${URL_FRONTEND:-http://localhost}
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------
  # React/Vite Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_URL_BACKEND=${URL_BACKEND:-http://localhost}
        - VITE_PORT_BACKEND=${PORT_BACKEND:-8000}
    ports:
      - ${PORT_FRONTEND:-3000}:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
