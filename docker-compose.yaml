# docker-compose.yml
name: app-portfolio

services:
  # ---------------------------------------------------------
  # IAM Authorization Proxy
  # ---------------------------------------------------------
  proxy:
    build:
      context: src/proxy
      dockerfile: Dockerfile
    environment:
      - URL_BACKEND=http://backend
      - PORT_BACKEND=8080
      - URL_FRONTEND=http://frontend
      - PORT_FRONTEND=8080
    ports:
      - ${PORT_PROXY}:8080
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ---------------------------------------------------------
  # Go Backend API
  # ---------------------------------------------------------
  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - ${PORT_BACKEND}:8080
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------
  # React/Vite Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    ports:
      - ${PORT_FRONTEND}:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
