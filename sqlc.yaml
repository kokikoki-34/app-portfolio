version: "2"
sql:
  - schema: "./db/schema/sys"
    queries: "./src/backend/internal/func/health/infra/db/sql"
    engine: "postgresql"
    gen:
      go:
        package: "gen"
        out: "./src/backend/internal/func/health/infra/db/gen"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
