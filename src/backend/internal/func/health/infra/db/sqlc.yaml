version: "2"
sql:
  - schema:
      - "../../../../../../../db/schema/sys"
    queries: "./sql"
    engine: "postgresql"
    gen:
      go:
        package: "gen"
        out: "./gen"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
