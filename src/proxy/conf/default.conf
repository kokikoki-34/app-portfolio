server {
    listen 8080;

    location /api/ {
        proxy_pass ${URL_BACKEND};
        proxy_set_header Authorization "Bearer ${ID_TOKEN_BACKEND}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass ${URL_FRONTEND};
        proxy_set_header Authorization "Bearer ${ID_TOKEN_FRONTEND}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
