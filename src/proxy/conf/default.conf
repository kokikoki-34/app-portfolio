server {
    listen 8080;

    location /api/ {
        proxy_pass ${URL_BACKEND}/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $proxy_host;
    }

    location / {
        proxy_pass ${URL_FRONTEND}/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
    }
}
