version: 3

includes:
  _migration:
    taskfile: ./src/backend/taskfile.yaml
    internal: true

  _docs:
    taskfile: ./tools/db/taskfile.yaml
    internal: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Set up develop environment
    cmds:
      - mise install

  app:build:
    desc: Build application
    cmds:
      - docker compose build

  app:run:
    desc: Run application
    cmds:
      - docker compose up

  app:stop:
    desc: Clean up residual container
    cmds:
      - docker compose down

  database:delete:
    desc: Remove database
    cmds:
      - docker compose down -v

  migration:create:
    desc: Create migration
    cmds:
      - task: _migration:create

  docs:generate:
    desc: Generate documents
    cmds:
      - task: _docs:generate
