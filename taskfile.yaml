version: 3

includes:
  local:backend:
    taskfile: ./tasks/backend/local.yaml

  local:frontend:
    taskfile: ./tasks/frontend/local.yaml

  container:backend:
    taskfile: ./tasks/backend/container.yaml

  container:frontend:
    taskfile: ./tasks/frontend/container.yaml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Set up develop environment
    cmds:
      - mise install
      - direnv allow

  local:run:
    desc: "Run BOTH apps locally."
    cmds:
      - overmind start

  local:build:
    desc: "Build BOTH apps locally."
    cmds:
      - task: "local:backend:build"
      - task: "local:frontend:build"

  local:clean:
    desc: Clean up residual processes if any
    cmds:
      - pkill -f "nginx|api|vite" || true

  
