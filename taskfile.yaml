version: 3

includes:
  local:backend:
    taskfile: ./tasks/backend/local.yaml

  local:frontend:
    taskfile: ./tasks/frontend/local.yaml

  container:backend:
    taskfile: ./tasks/backend/container.yaml

  container:frontend:
    taskfile: ./tasks/frontend/container.yaml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Set up develop environment
    cmds:
      - mise install
      - direnv allow

  run:
    desc: "Run BOTH apps. (Usage: task dev [MODE=container])"
    vars:
      MODE: '{{default "local" .MODE}}'
    deps:
      - task: "{{.MODE}}:backend:run"
      - task: "{{.MODE}}:frontend:run"

  build:
    desc: "Build BOTH apps. (Usage: task build [MODE=container])"
    vars:
      MODE: '{{default "local" .MODE}}'
    deps:
      - task: "{{.MODE}}:backend:build"
      - task: "{{.MODE}}:frontend:build"
