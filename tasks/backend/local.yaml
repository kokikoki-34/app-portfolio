version: 3

tasks:
  build:
    desc: Build the server.
    dir: "{{.ROOT_DIR}}/src/backend"
    cmds:
      - mkdir -p bin
      - go build -o bin/api cmd/main.go

  run:
    desc: Run the server locally.
    dir: "{{.ROOT_DIR}}/src/backend"
    vars:
      PORT: '{{default "8082" .PORT}}'
    cmds:
      - task: build
      - PORT={{.PORT_BACKEND}} ./bin/api
